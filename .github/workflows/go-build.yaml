name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: blacksmith
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.6

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          install-only: true

      - name: Setup access for private go modules
        run: |
          git config --global url."https://git:$GO_GITHUB_TOKEN@github.com".insteadOf "https://github.com"
        env:
          GO_GITHUB_TOKEN: ${{ secrets.GO_GITHUB_TOKEN }}

      - name: Check go mod tidy
        run: make tidy && git diff --exit-code

      # Validates every component registry, runs the Rego policies and the
      # stability disclosure, and proves each policy still fires against its
      # deliberately broken fixture. A policy nobody has seen fail is a policy
      # nobody knows works.
      - name: Check telemetry registries
        run: make telemetry-check

      # The generated telemetry is committed, so regenerate and fail on any
      # difference: a registry change that was never generated would otherwise
      # ship with the code and the parity report out of step. Staged, so a newly
      # generated or orphaned file cannot pass unnoticed.
      - name: Check generated telemetry is current
        run: |
          make telemetry-generate
          git add -A
          git diff --cached --exit-code

      # Reports renamed, removed and added upstream keys against the base
      # branch. Informational: semconv drift is a review input, not a build
      # failure -- `telemetry-check` is what fails when a key stops resolving.
      - name: Report semconv drift
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          for r in receiver/*/telemetry/registry; do
            [ -d "/tmp/base/$r" ] || continue
            echo "## $r"
            ./telemetry/weaver.sh diff "/tmp/base/$r" "$r" || true
          done

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Integration test
        run: make test-integration
